name: Publish

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

concurrency:
  group: publish-${{ github.head_ref || github.run_id }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node and pnpm
        uses: silverhand-io/actions-node-pnpm-run-steps@v5
        with:
          pnpm-version: 10.8.0
          node-version: 22

      - name: Publish to npm
        working-directory: packages/mcp-auth
        # Prerelease versions go to the `beta` dist-tag so `latest` keeps serving the stable line
        run: |
          if [[ "$(jq -r .version package.json)" == *-* ]]; then
            pnpm publish --provenance --no-git-checks --tag beta
          else
            pnpm publish --provenance --no-git-checks
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_AUTOMATION_TOKEN }}
