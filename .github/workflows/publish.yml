name: Publish

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

concurrency:
  group: publish-${{ github.head_ref || github.run_id }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node and pnpm
        uses: silverhand-io/actions-node-pnpm-run-steps@v5
        with:
          pnpm-version: 10.34.5
          node-version: 22

      # Authenticates via OIDC trusted publishing (configured on npmjs.com for this
      # package: repository mcp-auth/js, workflow publish.yml) — no npm token involved.
      # Runs through `npx npm@11` because npm's OIDC support requires npm >= 11.5.1,
      # while `pnpm publish` delegates to the npm bundled with Node (10.x on Node 22).
      # npm 11 also requires an explicit --tag for prerelease versions; this package
      # deliberately publishes betas to `latest` (the ecosystem default is MCP SDK v2).
      - name: Publish to npm
        working-directory: packages/mcp-auth
        run: npx --yes npm@11 publish --tag latest --provenance
